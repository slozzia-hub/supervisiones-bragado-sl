
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SISE | Supervisión Educativa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E🏫%3C/text%3E%3C/svg%3E">

<style>
:root{
  font-family:Arial,Helvetica,sans-serif;
  color:#203746;
  background:#f2f6f8;
}
*{box-sizing:border-box}
body{margin:0}
button,input,select,textarea{font:inherit}
button{
  background:#126c72;color:white;border:0;
  border-radius:8px;padding:10px 14px;cursor:pointer;
}
button:hover{filter:brightness(.94)}
button:disabled{opacity:.5;cursor:not-allowed}
button.secondary{background:#e4eef0;color:#194653}
button.danger{background:#a33d40}
input,select,textarea{
  width:100%;padding:10px;border:1px solid #ccd8df;
  border-radius:8px;background:white;
}
textarea{min-height:130px;resize:vertical}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 5px}
h1,h2,h3{color:#153c4c}
h1{font-size:27px}
h2{font-size:21px}
small,.muted{color:#657d89}
.hidden{display:none!important}
.layout{display:flex;min-height:100vh}
aside{
  background:#123546;color:white;width:240px;
  padding:22px 14px;flex-shrink:0;
}
aside h2{color:white;margin:0 8px}
aside p{color:#c1d5dd}
nav{margin:25px 0}
nav button{
  display:block;width:100%;text-align:left;
  margin:4px 0;background:transparent;
}
nav button.active,nav button:hover{background:#28586a}
main{flex:1;min-width:0;padding:25px}
.top{
  display:flex;justify-content:space-between;
  align-items:center;gap:15px;flex-wrap:wrap;
}
.panel,.card{
  background:white;border:1px solid #dfe7eb;
  border-radius:12px;padding:20px;margin-bottom:16px;
  box-shadow:0 2px 8px #12354608;
}
.cards{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin:20px 0;
}
.card strong{display:block;font-size:30px;margin-top:10px}
.schoolgrid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:14px;
}
.schoolcard{
  text-align:left;background:white;color:#173e4d;
  border:1px solid #d6e3e9;border-radius:12px;
  padding:22px;min-height:150px;
}
.schoolcard:hover{background:#edf8f7;border-color:#168087}
.schoolcard strong{display:block;font-size:19px;margin:10px 0}
.schoolcard small{display:block}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.toolbar select{max-width:300px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px;text-align:left;border-bottom:1px solid #e5ecef}
th{background:#f4f7f8}
.tablewrap{overflow-x:auto}
.pill{
  display:inline-block;padding:5px 9px;border-radius:20px;
  background:#e8eff1;font-size:12px;margin:3px;
}
.warn{background:#fff0d7;color:#885b12}
.good{background:#e0f4e9;color:#246a49}
.notice{
  background:#fff8e8;border-left:4px solid #d6a044;
  padding:13px;border-radius:5px;margin:15px 0;
}
.row{
  display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 0;border-bottom:1px solid #e8eef1;
}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wide{grid-column:1/-1}
.login{max-width:430px;margin:9vh auto}
dialog{
  border:0;border-radius:15px;padding:24px;
  width:min(850px,95vw);max-height:90vh;overflow:auto;
  box-shadow:0 15px 70px #102e3b55;
}
dialog::backdrop{background:#102e3b88}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.review{
  border:1px solid #dce7e9;border-radius:10px;
  padding:15px;margin:10px 0;
}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
#toast{
  position:fixed;bottom:20px;right:20px;
  background:#173e4d;color:white;padding:15px;
  border-radius:9px;display:none;max-width:420px;z-index:20;
}
@media(max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .layout{display:block}
  aside{width:100%}
  nav{display:flex;overflow-x:auto}
  nav button{width:auto;white-space:nowrap}
  main{padding:14px}
  .formgrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<section id="login" class="login panel">
  <h1>🏫 SISE</h1>
  <p>Sistema Integral de Supervisión Educativa</p>
  <p class="muted">Acceso autorizado</p>
  <form id="loginForm">
    <label>Correo electrónico</label>
    <input id="email" type="email" required>
    <label>Contraseña</label>
    <input id="password" type="password" required>
    <div class="actions">
      <button type="submit">Ingresar</button>
    </div>
  </form>
  <p id="loginError" class="muted"></p>
</section>

<div id="app" class="layout hidden">
  <aside>
    <h2>🏫 SISE</h2>
    <p>Sistema de Supervisión Educativa</p>
    <nav id="nav"></nav>
    <button id="logout" class="secondary">Cerrar sesión</button>
    <p id="userInfo"></p>
  </aside>

  <main>
    <header class="top">
      <div>
        <h1 id="pageTitle">Panel supervisivo</h1>
        <p class="muted">Información institucional y decisiones de mejora</p>
      </div>
      <div class="toolbar">
        <select id="schoolFilter"></select>
        <button id="refresh" class="secondary">Actualizar</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>

<dialog id="modal">
  <h2 id="modalTitle"></h2>
  <form id="modalForm">
    <div id="modalBody"></div>
    <div class="actions">
      <button type="submit">Guardar</button>
      <button type="button" class="secondary" id="cancel">
        Cancelar
      </button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script src="config.js?v=5"></script>

<script type="module">
import {createClient} from
"https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const cfg=window.SISE_CONFIG||{};
const sb=cfg.url&&cfg.anonKey
  ?createClient(cfg.url,cfg.anonKey)
  :null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
}[c]));

const today=()=>new Date().toLocaleDateString("en-CA");
const pretty=d=>d
  ?new Date(d+"T12:00:00").toLocaleDateString("es-AR")
  :"—";

let user=null,role="reader",schools=[],data={};
let page="dashboard",filter="all",selectedSchool=null;
let modalAction=null;

const tables=[
  "schools","visits","incidents","metrics",
  "strikes","agreements","documents","supervision_reports"
];

const labels={
  visits:"Visitas",
  incidents:"Convivencia",
  metrics:"Matrícula y asistencia",
  strikes:"Paros",
  agreements:"Acuerdos",
  documents:"Documentos"
};

const columns={
  visits:["visit_date","title","visit_type","guidance"],
  incidents:["incident_date","category","severity","status"],
  metrics:["period","enrollment","attendance_pct","chronic_absence_count"],
  strikes:["strike_date","total_teachers","adhering_teachers","affected_sections"],
  agreements:["title","dimension","due_date","status"],
  documents:["title","document_type","created_at"]
};

const names={
  visit_date:"Fecha",title:"Título",visit_type:"Tipo",
  guidance:"Orientaciones",incident_date:"Fecha",
  category:"Categoría",severity:"Atención",status:"Estado",
  period:"Período",enrollment:"Matrícula",
  attendance_pct:"Asistencia (%)",
  chronic_absence_count:"Inasistencias reiteradas",
  strike_date:"Fecha",total_teachers:"Docentes",
  adhering_teachers:"Adherentes",
  affected_sections:"Secciones afectadas",
  dimension:"Dimensión",due_date:"Plazo",
  document_type:"Tipo",created_at:"Carga"
};

function notify(message){
  $("#toast").textContent=message;
  $("#toast").style.display="block";
  setTimeout(()=>$("#toast").style.display="none",5000);
}

function canEdit(){
  return role==="admin"||role==="inspector";
}

function schoolName(id){
  return schools.find(s=>s.id===id)?.code||"—";
}

function rowsFor(table,id=filter){
  return (data[table]||[]).filter(r=>
    id==="all"||r.school_id===id
  );
}

function reportsFor(id){
  return rowsFor("supervision_reports",id)
    .sort((a,b)=>b.report_date.localeCompare(a.report_date));
}

function findingsFor(id){
  return reportsFor(id).flatMap(r=>
    (r.findings||[])
      .filter(f=>f.confirmed)
      .map(f=>({...f,report:r}))
  );
}

async function load(){
  if(!sb)throw Error("Falta configurar config.js");

  const results=await Promise.all(tables.map(async t=>{
    const {data:rows,error}=await sb.from(t).select("*");
    if(error)throw Error(t+": "+error.message);
    return [t,rows||[]];
  }));

  data=Object.fromEntries(results);
  schools=data.schools.sort((a,b)=>
    a.code.localeCompare(b.code,"es",{numeric:true})
  );

  $("#schoolFilter").innerHTML=
    '<option value="all">Todas las escuelas</option>'+
    schools.map(s=>
      `<option value="${s.id}">${esc(s.code)} · ${esc(s.name)}</option>`
    ).join("");

  if(filter!=="all"&&!schools.some(s=>s.id===filter))
    filter="all";

  $("#schoolFilter").value=filter;
  render();
}

function navigation(){
  const items=[
    ["dashboard","Panel general"],
    ["schools","Carpetas por escuela"],
    ["reports","Informes de supervisión"],
    ["improvements","Áreas de mejora"],
    ...Object.entries(labels)
  ];

  $("#nav").innerHTML=items.map(([key,label])=>
    `<button data-page="${key}" class="${page===key?"active":""}">
      ${esc(label)}
    </button>`
  ).join("");

  $("#nav").querySelectorAll("[data-page]").forEach(b=>{
    b.onclick=()=>{
      page=b.dataset.page;
      selectedSchool=null;
      render();
    };
  });
}

function render(){
  navigation();

  const titles={
    dashboard:"Panel supervisivo",
    schools:"Carpetas institucionales",
    reports:"Informes de supervisión",
    improvements:"Áreas de mejora",
    ...labels
  };

  $("#pageTitle").textContent=titles[page]||"SISE";

  if(page==="dashboard")return dashboard();
  if(page==="schools")return schoolFolders();
  if(page==="reports")return reportsPage();
  if(page==="improvements")return improvements();
  if(labels[page])return recordsPage(page);
}

function dashboard(){
  const ids=filter==="all"
    ?schools.map(s=>s.id):[filter];

  const reports=rowsFor("supervision_reports");
  const agreements=rowsFor("agreements");
  const incidents=rowsFor("incidents");

  const validated=ids.flatMap(id=>findingsFor(id));

  const latest=ids.map(id=>
    rowsFor("metrics",id)
      .sort((a,b)=>b.period.localeCompare(a.period))[0]
  ).filter(Boolean);

  const attendance=latest.filter(m=>m.attendance_pct!=null);
  const average=attendance.length
    ?(attendance.reduce((a,m)=>a+Number(m.attendance_pct),0)
      /attendance.length).toFixed(1)+"%"
    :"Sin datos";

  $("#content").innerHTML=`
    <div class="cards">
      <div class="card">Escuelas<strong>${ids.length}</strong></div>
      <div class="card">Informes<strong>${reports.length}</strong></div>
      <div class="card">Áreas validadas<strong>${validated.length}</strong></div>
      <div class="card">Acuerdos pendientes
        <strong>${agreements.filter(a=>a.status!=="cumplido").length}</strong>
      </div>
    </div>

    <div class="panel">
      <h2>Seguimiento institucional</h2>
      <p>Asistencia promedio del último registro: <b>${average}</b></p>
      <p class="muted">
        Promedio simple de escuelas con datos; los períodos
        pueden diferir y no está ponderado por matrícula.
      </p>
      <p>Situaciones de convivencia abiertas:
        <b>${incidents.filter(i=>i.status!=="cerrado").length}</b>
      </p>
    </div>

    <div class="panel">
      <h2>Áreas de mejora identificadas</h2>
      ${validated.length
        ?validated.slice(0,20).map(f=>`
          <p>
            <span class="pill warn">${esc(schoolName(f.report.school_id))}</span>
            <b>${esc(f.dimension)}</b>: ${esc(f.summary)}
          </p>`).join("")
        :'<p class="muted">Aún no hay áreas validadas.</p>'}
    </div>

    <div class="panel">
      <h2>Acceso a los legajos</h2>
      <button id="goSchools">Abrir carpetas institucionales</button>
    </div>
  `;

  $("#goSchools").onclick=()=>{
    page="schools";
    render();
  };
}

function schoolFolders(){
  const list=filter==="all"
    ?schools:schools.filter(s=>s.id===filter);

  $("#content").innerHTML=`
    <div class="notice">
      Cada escuela dispone de un legajo digital propio.
      Los informes y registros quedan asociados a la institución.
    </div>
    <div class="schoolgrid">
      ${list.map(s=>`
        <button class="schoolcard" data-school="${s.id}">
          <span style="font-size:30px">📁</span>
          <strong>${esc(s.code)}</strong>
          <span>${esc(s.name)}</span>
          <small>${reportsFor(s.id).length} informes de supervisión</small>
          <small>${findingsFor(s.id).length} áreas validadas</small>
        </button>
      `).join("")}
    </div>
    <div id="schoolDetail"></div>
  `;

  $("#content").querySelectorAll("[data-school]").forEach(b=>{
    b.onclick=()=>schoolDetail(b.dataset.school);
  });

  if(selectedSchool&&list.some(s=>s.id===selectedSchool))
    schoolDetail(selectedSchool);
  else if(filter!=="all")
    schoolDetail(filter);
}

function schoolDetail(id){
  const s=schools.find(x=>x.id===id);
  if(!s)return;
  selectedSchool=id;

  const reports=reportsFor(id);
  const findings=findingsFor(id);
  const agreements=rowsFor("agreements",id);
  const metrics=rowsFor("metrics",id)
    .sort((a,b)=>b.period.localeCompare(a.period));
  const incidents=rowsFor("incidents",id);
  const visits=rowsFor("visits",id);
  const strikes=rowsFor("strikes",id);

  $("#schoolDetail").innerHTML=`
    <section class="panel" style="margin-top:22px">
      <h2>📁 Legajo ${esc(s.code)} · ${esc(s.name)}</h2>
      <p><b>Localidad:</b> ${esc(s.locality||"Sin registrar")}</p>
      <p><b>Dirección:</b> ${esc(s.director||"Sin registrar")}</p>
      <p><b>Turnos:</b> ${esc(s.shifts||"Sin registrar")}</p>

      <div class="toolbar">
        ${canEdit()?'<button id="addReport">+ Cargar informe</button>':""}
        <button class="secondary" data-go="metrics">Matrícula y asistencia</button>
        <button class="secondary" data-go="agreements">Acuerdos</button>
        <button class="secondary" data-go="incidents">Convivencia</button>
      </div>

      <h3>Informes de supervisión (${reports.length})</h3>
      ${reports.map(r=>`
        <div class="row">
          <div>
            <b>${esc(r.title)}</b>
            <div class="muted">
              ${pretty(r.report_date)} ·
              ${esc(r.source_filename||"Texto incorporado")}
            </div>
          </div>
          <button class="secondary" data-review="${r.id}">
            Analizar / revisar
          </button>
        </div>
      `).join("")||'<p class="muted">Sin informes cargados.</p>'}

      <h3>Áreas de mejora validadas (${findings.length})</h3>
      ${findings.map(f=>`
        <div class="review">
          <span class="pill warn">${esc(f.dimension)}</span>
          <p>${esc(f.summary)}</p>
          <small>Fuente: ${esc(f.report.title)}</small>
        </div>
      `).join("")||'<p class="muted">Todavía no hay áreas validadas.</p>'}

      <h3>Seguimiento institucional</h3>
      <p>Visitas: ${visits.length} ·
      Situaciones de convivencia: ${incidents.length} ·
      Registros de paros: ${strikes.length}</p>

      <h3>Acuerdos</h3>
      ${agreements.map(a=>`
        <p>${esc(a.title)} ·
        <span class="pill">${esc(a.status)}</span></p>
      `).join("")||'<p class="muted">Sin acuerdos cargados.</p>'}

      <h3>Últimos indicadores</h3>
      ${metrics[0]
        ?`<p>Matrícula: ${esc(metrics[0].enrollment)} ·
          Asistencia: ${esc(metrics[0].attendance_pct)}%</p>`
        :'<p class="muted">Sin indicadores registrados.</p>'}
    </section>
  `;

  $("#addReport")?.addEventListener("click",()=>reportForm(id));

  $("#schoolDetail").querySelectorAll("[data-review]").forEach(b=>{
    b.onclick=()=>reviewReport(b.dataset.review);
  });

  $("#schoolDetail").querySelectorAll("[data-go]").forEach(b=>{
    b.onclick=()=>{
      filter=id;
      $("#schoolFilter").value=id;
      page=b.dataset.go;
      render();
    };
  });
}

function reportsPage(){
  const reports=rowsFor("supervision_reports")
    .sort((a,b)=>b.report_date.localeCompare(a.report_date));

  $("#content").innerHTML=`
    <div class="notice">
      Los informes permiten detectar temas para revisión.
      Una coincidencia de palabras no demuestra una dificultad.
      La validación corresponde a la Supervisión.
    </div>

    <div class="toolbar">
      ${canEdit()&&schools.length
        ?'<button id="newReport">+ Cargar informe de supervisión</button>'
        :""}
    </div>

    <div class="panel">
      ${reports.map(r=>`
        <div class="row">
          <div>
            <b>${esc(r.title)}</b>
            <div class="muted">
              ${esc(schoolName(r.school_id))} ·
              ${pretty(r.report_date)}
            </div>
          </div>
          <button class="secondary" data-review="${r.id}">
            Revisar informe
          </button>
        </div>
      `).join("")||'<p>No hay informes registrados.</p>'}
    </div>
  `;

  $("#newReport")?.addEventListener("click",()=>reportForm(
    filter==="all"?null:filter
  ));

  $("#content").querySelectorAll("[data-review]").forEach(b=>{
    b.onclick=()=>reviewReport(b.dataset.review);
  });
}

// Detección preliminar de temas.
// No interpreta el sentido pedagógico completo del informe.
const patterns={
  "Enseñanza":[
    "enseñanza","intervenciones docentes","diversificación",
    "secuencia didáctica","planificación","propuesta didáctica"
  ],
  "Alfabetización":[
    "alfabetización","lectura","escritura",
    "situaciones de lectura","producciones escritas"
  ],
  "Matemática":[
    "matemática","resolución de problemas",
    "cálculo","numeración"
  ],
  "Trayectorias educativas":[
    "trayectoria","inasistencias","revinculación",
    "continuidad pedagógica","intensificación"
  ],
  "Convivencia":[
    "convivencia","conflicto","acuerdos de convivencia",
    "intervención institucional"
  ],
  "Gestión institucional":[
    "equipo directivo","seguimiento","mesa de trabajo",
    "acuerdos institucionales","registro institucional"
  ],
  "Inclusión educativa":[
    "inclusión","ppi","configuraciones de apoyo",
    "propuesta pedagógica de inclusión"
  ]
};

function normalizeText(t){
  return t.normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase();
}

function extractSignals(text){
  const paragraphs=text.split(/\n+/)
    .map(x=>x.trim()).filter(Boolean);

  const found=[];

  for(const [dimension,words] of Object.entries(patterns)){
    const matches=paragraphs.filter(p=>
      words.some(w=>
        normalizeText(p).includes(normalizeText(w))
      )
    ).slice(0,4);

    if(matches.length){
      found.push({
        dimension,
        summary:"Tema identificado para revisión contextual",
        evidence:matches.map(x=>x.slice(0,450)).join(" […] "),
        confirmed:false
      });
    }
  }

  return found;
}

function reportForm(id){
  if(!canEdit())return;

  modalAction={type:"newReport"};
  $("#modalTitle").textContent="Cargar informe de supervisión";

  $("#modalBody").innerHTML=`
    <div class="formgrid">
      <div class="wide">
        <label>Escuela</label>
        <select id="repSchool" required>
          ${schools.map(s=>`
            <option value="${s.id}" ${s.id===id?"selected":""}>
              ${esc(s.code)} · ${esc(s.name)}
            </option>
          `).join("")}
        </select>
      </div>

      <div>
        <label>Fecha del informe</label>
        <input id="repDate" type="date" value="${today()}" required>
      </div>

      <div>
        <label>Título o motivo</label>
        <input id="repTitle" maxlength="250" required>
      </div>

      <div class="wide">
        <label>Archivo PDF, DOCX o TXT (opcional)</label>
        <input id="repFile" type="file"
          accept=".pdf,.docx,.txt">
      </div>

      <div class="wide">
        <label>Texto del informe</label>
        <textarea id="repText" rows="12"
          placeholder="Pegá el informe completo aquí, o seleccioná un archivo."></textarea>
      </div>

      <div class="wide muted">
        Los PDF escaneados sin texto requieren transcripción.
        El contenido textual se almacenará en Supabase.
        Evitá incluir datos personales sensibles innecesarios.
      </div>
    </div>
  `;

  $("#modal").showModal();
}

async function extractFile(file){
  if(file.size>10485760)
    throw Error("El archivo supera los 10 MB.");

  const ext=file.name.split(".").pop().toLowerCase();

  if(ext==="txt")return file.text();

  if(ext==="docx"){
    const mammoth=await import(
      "https://cdn.jsdelivr.net/npm/mammoth@1.9.1/+esm"
    );
    const result=await mammoth.extractRawText({
      arrayBuffer:await file.arrayBuffer()
    });
    return result.value;
  }

  if(ext==="pdf"){
    const pdfjs=await import(
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs"
    );

    pdfjs.GlobalWorkerOptions.workerSrc=
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs";

    const pdf=await pdfjs.getDocument({
      data:new Uint8Array(await file.arrayBuffer())
    }).promise;

    const parts=[];

    for(let n=1;n<=pdf.numPages;n++){
      const p=await pdf.getPage(n);
      const content=await p.getTextContent();
      parts.push(content.items.map(x=>x.str||"").join(" "));
    }

    return parts.join("\n\n");
  }

  throw Error("Formato no admitido.");
}

async function saveReport(){
  const file=$("#repFile").files[0];
  let text=$("#repText").value.trim();

  if(file){
    const extracted=(await extractFile(file)).trim();
    if(extracted)text=[text,extracted].filter(Boolean).join("\n\n");
  }

  if(text.length<60)
    throw Error("El informe necesita al menos 60 caracteres de texto.");

  const payload={
    school_id:$("#repSchool").value,
    title:$("#repTitle").value.trim(),
    report_date:$("#repDate").value,
    report_text:text,
    source_filename:file?.name||null,
    findings:extractSignals(text)
  };

  if(!payload.title||!payload.report_date)
    throw Error("Completá título y fecha.");

  const {error}=await sb.from("supervision_reports").insert(payload);
  if(error)throw error;
}

function reviewReport(id){
  const r=(data.supervision_reports||[]).find(x=>x.id===id);
  if(!r)return;

  modalAction={type:"review",record:r};
  $("#modalTitle").textContent="Análisis supervisivo";

  const findings=r.findings||[];

  $("#modalBody").innerHTML=`
    <p><b>${esc(schoolName(r.school_id))}</b> ·
    ${esc(r.title)} · ${pretty(r.report_date)}</p>

    <div class="notice">
      Revisá el contexto de cada fragmento. Validá únicamente
      las áreas de mejora fundamentadas en evidencias.
    </div>

    ${findings.map((f,i)=>`
      <div class="review">
        <label>
          <input type="checkbox" data-check="${i}"
            style="width:auto"
            ${f.confirmed?"checked":""}>
          ${esc(f.dimension)} — Validar como área de mejora
        </label>

        <p class="muted">${esc(f.evidence)}</p>

        <label>Fundamentación y orientación supervisiva</label>
        <textarea data-summary="${i}">${esc(f.summary)}</textarea>
      </div>
    `).join("")||`
      <p>No se identificaron coincidencias automáticas.
      El informe puede revisarse manualmente.</p>
    `}

    <details>
      <summary>Consultar texto completo del informe</summary>
      <pre>${esc(r.report_text)}</pre>
    </details>
  `;

  $("#modal").showModal();
}

async function saveReview(){
  const r=modalAction.record;

  const findings=(r.findings||[]).map((f,i)=>({
    ...f,
    confirmed:!!$(`[data-check="${i}"]`)?.checked,
    summary:$(`[data-summary="${i}"]`)?.value.trim()||f.summary
  }));

  const {error}=await sb.from("supervision_reports")
    .update({findings})
    .eq("id",r.id);

  if(error)throw error;
}

function improvements(){
  const ids=filter==="all"
    ?schools.map(s=>s.id):[filter];

  $("#content").innerHTML=`
    <div class="notice">
      Las áreas presentadas fueron validadas por la Supervisión.
      No constituyen una calificación automática de la escuela.
    </div>

    ${ids.map(id=>{
      const s=schools.find(x=>x.id===id);
      const found=findingsFor(id);

      return `
        <section class="panel">
          <h2>${esc(s?.code||"")} · ${esc(s?.name||"")}</h2>
          ${found.map(f=>`
            <div class="review">
              <span class="pill warn">${esc(f.dimension)}</span>
              <p>${esc(f.summary)}</p>
              <small>Informe: ${esc(f.report.title)}</small>
            </div>
          `).join("")||'<p class="muted">Sin áreas validadas.</p>'}
        </section>
      `;
    }).join("")}
  `;
}

function recordsPage(table){
  const rows=rowsFor(table);
  const cols=columns[table]||[];

  $("#content").innerHTML=`
    <div class="panel tablewrap">
      <h2>${esc(labels[table])}</h2>
      <p class="muted">
        Registros institucionales existentes en Supabase.
      </p>
      <table>
        <thead>
          <tr>
            <th>Escuela</th>
            ${cols.map(c=>`<th>${esc(names[c]||c)}</th>`).join("")}
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${esc(schoolName(r.school_id))}</td>
              ${cols.map(c=>`
                <td>${esc(r[c])}</td>
              `).join("")}
            </tr>
          `).join("")||`
            <tr><td colspan="10">Sin registros.</td></tr>
          `}
        </tbody>
      </table>
    </div>
  `;
}

$("#modalForm").onsubmit=async e=>{
  e.preventDefault();

  if(!canEdit())return;

  const button=e.currentTarget.querySelector('[type="submit"]');
  button.disabled=true;

  try{
    if(modalAction?.type==="newReport")
      await saveReport();

    if(modalAction?.type==="review")
      await saveReview();

    $("#modal").close();
    notify("Información guardada correctamente.");
    await load();
  }catch(err){
    notify("Error: "+err.message);
  }finally{
    button.disabled=false;
  }
};

$("#cancel").onclick=()=>$("#modal").close();

$("#schoolFilter").onchange=e=>{
  filter=e.target.value;
  selectedSchool=null;
  render();
};

$("#refresh").onclick=()=>load().catch(e=>notify(e.message));

$("#logout").onclick=async()=>{
  await sb.auth.signOut();
  location.reload();
};

$("#loginForm").onsubmit=async e=>{
  e.preventDefault();
  $("#loginError").textContent="";

  try{
    if(!sb)throw Error("Falta configurar config.js");

    const {error}=await sb.auth.signInWithPassword({
      email:$("#email").value,
      password:$("#password").value
    });

    if(error)throw error;
    await start();
  }catch(err){
    $("#loginError").textContent=err.message;
  }
};

async function start(){
  if(!sb)throw Error("Falta la conexión con Supabase.");

  const {data:auth,error:authError}=await sb.auth.getUser();
  if(authError||!auth.user)return;

  user=auth.user;

  const {data:profile,error}=await sb.from("profiles")
    .select("role,full_name")
    .eq("id",user.id)
    .single();

  if(error||!profile)
    throw Error("La cuenta no tiene perfil autorizado.");

  role=profile.role;

  $("#userInfo").textContent=
    (profile.full_name||user.email)+" · "+role;

  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");

  await load();
}

if(sb){
  start().catch(err=>{
    notify(err.message);
    $("#login").classList.remove("hidden");
    $("#app").classList.add("hidden");
  });
}
</script>
</body>
</html>
