<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SISE | Sistema Integral de Supervisión Educativa</title>

<!-- Librerías para procesar PDF y DOCX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

<style>
:root {
  --primary:#164b60;
  --secondary:#167d83;
  --background:#f3f6f8;
  --surface:#ffffff;
  --text:#263c49;
  --muted:#687f8c;
  --border:#dbe5e9;
  --danger:#ad4247;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--background);
  color:var(--text);
}

h1,h2,h3 { color:var(--primary); }
h1 { font-size:26px; }
h2 { font-size:21px; }
h3 { font-size:17px; }

button,input,select,textarea { font:inherit; }

button {
  border:0;
  background:var(--secondary);
  color:white;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

button:hover { filter:brightness(.95); }
button:disabled { opacity:.5;cursor:not-allowed; }

button.secondary {
  background:#e4edf0;
  color:var(--primary);
}

button.danger { background:var(--danger); color: white; }

input,select,textarea {
  width:100%;
  padding:10px;
  border:1px solid #cbd9df;
  border-radius:8px;
  background:white;
}

textarea {
  min-height:125px;
  resize:vertical;
}

label {
  display:block;
  margin:12px 0 5px;
  font-size:14px;
  font-weight:600;
}

.hidden { display:none!important; }
.muted { color:var(--muted); }
.small { font-size:13px; }

.layout {
  display:flex;
  min-height:100vh;
}

.sidebar {
  width:260px;
  background:#153b4d;
  color:white;
  padding:24px 15px;
  flex-shrink:0;
}

.sidebar h2 { color:white;margin:0; }
.sidebar p { color:#bfd0d9; }

.sidebar nav { margin:24px 0; }

.sidebar nav button {
  display:block;
  width:100%;
  text-align:left;
  margin:5px 0;
  background:transparent;
}

.sidebar nav button.active,
.sidebar nav button:hover {
  background:#2b5d70;
}

.main {
  flex:1;
  min-width:0;
  padding:25px;
}

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:20px;
}

.panel,.card {
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:20px;
  margin-bottom:16px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card strong {
  display:block;
  font-size:29px;
  margin-top:10px;
}

.schoolgrid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:14px;
}

.schoolcard {
  background:white;
  color:var(--primary);
  border:1px solid var(--border);
  text-align:left;
  padding:22px;
  min-height:150px;
  cursor: pointer;
  border-radius: 8px;
}

.schoolcard strong {
  display:block;
  font-size:19px;
  margin:10px 0;
}

.schoolcard:hover {
  background:#eef8f7;
  border-color:var(--secondary);
}

.toolbar,.actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin:15px 0;
}

.toolbar select { max-width:320px; }

.row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  border-bottom:1px solid var(--border);
  padding:13px 0;
}

.formgrid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.wide { grid-column:1/-1; }

.notice {
  background:#fff7e6;
  border-left:4px solid #d9a13b;
  padding:14px;
  margin:15px 0;
  border-radius:6px;
}

.pill {
  display:inline-block;
  background:#e7f0f2;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  margin:3px;
}

.review {
  border:1px solid var(--border);
  padding:16px;
  margin:12px 0;
  border-radius:10px;
}

.upload {
  border:2px dashed var(--secondary);
  background:#eef8f7;
  padding:22px;
  border-radius:12px;
}

.upload input { background:white; }

.tablewrap { overflow-x:auto; }

table {
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td {
  border-bottom:1px solid var(--border);
  padding:12px;
  text-align:left;
  vertical-align:top;
}

th { background:#f4f7f8; }

.login {
  max-width:430px;
  margin:9vh auto;
}

dialog {
  width:min(850px,95vw);
  max-height:90vh;
  overflow:auto;
  border:0;
  border-radius:14px;
  padding:25px;
  box-shadow:0 18px 70px #153b4d55;
}

dialog::backdrop { background:#102d3c88; }

pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
}

#toast {
  display:none;
  position:fixed;
  bottom:20px;
  right:20px;
  background:#153b4d;
  color:white;
  padding:15px;
  border-radius:9px;
  max-width:430px;
  z-index:50;
}

@media(max-width:900px) {
  .cards { grid-template-columns:repeat(2,1fr); }
}

@media(max-width:650px) {
  .layout { display:block; }
  .sidebar { width:100%; }
  .sidebar nav { display:flex;overflow-x:auto; }
  .sidebar nav button { width:auto;white-space:nowrap; }
  .main { padding:14px; }
  .formgrid { grid-template-columns:1fr; }
}
</style>
</head>

<body>

<section id="login" class="login panel">
  <h1>🏫 SISE</h1>
  <p>Sistema Integral de Supervisión Educativa</p>
  <p class="muted">Acceso autorizado</p>

  <form id="loginForm">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" required autocomplete="username">

    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="current-password">

    <div class="actions">
      <button type="submit">Ingresar</button>
    </div>
  </form>

  <p id="loginError" class="muted"></p>
</section>

<div id="app" class="layout hidden">

  <aside class="sidebar">
    <h2>🏫 SISE</h2>
    <p>Supervisión Educativa</p>

    <nav id="nav"></nav>

    <button id="logout" class="secondary">
      Cerrar sesión
    </button>

    <p id="userInfo" class="small"></p>
  </aside>

  <main class="main">

    <header class="topbar">
      <div>
        <h1 id="pageTitle">Panel supervisivo</h1>
        <p class="muted">
          Legajos institucionales y seguimiento pedagógico
        </p>
      </div>

      <div class="toolbar">
        <select id="schoolFilter"></select>
        <button id="refresh" class="secondary">
          Actualizar
        </button>
      </div>
    </header>

    <div id="content"></div>

  </main>
</div>

<dialog id="modal">
  <h2 id="modalTitle"></h2>

  <form id="modalForm">
    <div id="modalBody"></div>

    <div class="actions">
      <button type="submit" id="saveButton">
        Guardar
      </button>

      <button type="button" class="secondary" id="cancel">
        Cancelar
      </button>
    </div>
  </form>
</dialog>

<div id="toast"></div>

<script src="config.js?v=6"></script>

<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

// Configurar Worker de PDF.js
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const cfg=window.SISE_CONFIG||{};

const sb=(cfg.url&&cfg.anonKey)
  ?createClient(new URL(cfg.url).origin,cfg.anonKey)
  :null;

const $=selector=>document.querySelector(selector);

const esc=value=>String(value??"").replace(
  /[&<>"']/g,
  character=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[character]
);

const today=()=>new Date().toISOString().split("T")[0];

function pretty(date){
  if(!date)return "—";
  return new Date(date+"T12:00:00").toLocaleDateString("es-AR");
}

let user=null;
let role="reader";
let schools=[];
let data={};
let page="dashboard";
let filter="all";
let selectedSchool=null;
let modalAction=null;

const tables=[
  "schools",
  "visits",
  "incidents",
  "metrics",
  "strikes",
  "agreements",
  "documents",
  "supervision_reports"
];

const labels={
  visits:"Visitas",
  incidents:"Convivencia",
  metrics:"Matrícula y asistencia",
  strikes:"Paros",
  agreements:"Acuerdos",
  documents:"Documentos"
};

const columns={
  visits:["visit_date","title","visit_type","guidance"],
  incidents:["incident_date","category","severity","status"],
  metrics:["period","enrollment","attendance_pct","chronic_absence_count"],
  strikes:["strike_date","total_teachers","adhering_teachers","affected_sections"],
  agreements:["title","dimension","due_date","status"],
  documents:["title","document_type","created_at"]
};

const fieldLabels={
  visit_date:"Fecha",
  title:"Título",
  visit_type:"Tipo",
  guidance:"Orientaciones",
  incident_date:"Fecha",
  category:"Categoría",
  severity:"Atención",
  status:"Estado",
  period:"Período",
  enrollment:"Matrícula",
  attendance_pct:"Asistencia (%)",
  chronic_absence_count:"Inasistencias reiteradas",
  strike_date:"Fecha",
  total_teachers:"Docentes",
  adhering_teachers:"Adherentes",
  affected_sections:"Secciones afectadas",
  dimension:"Dimensión",
  due_date:"Plazo",
  document_type:"Tipo",
  created_at:"Carga"
};

function notify(message){
  $("#toast").textContent=message;
  $("#toast").style.display="block";

  setTimeout(()=>{
    $("#toast").style.display="none";
  },5000);
}

function canEdit(){
  return role==="admin"||role==="inspector";
}

function canManageSchools(){
  return role==="admin"||role==="inspector";
}

function schoolName(id){
  return schools.find(s=>s.id===id)?.code||"—";
}

function rowsFor(table,id=filter){
  return (data[table]||[]).filter(row=>
    id==="all"||row.school_id===id
  );
}

function reportsFor(id){
  return rowsFor("supervision_reports",id)
    .sort((a,b)=>
      (b.report_date||"").localeCompare(a.report_date||"")
    );
}

function findingsFor(id){
  return reportsFor(id).flatMap(report=>
    (report.findings||[])
      .filter(finding=>finding.confirmed)
      .map(finding=>({
        ...finding,
        report
      }))
  );
}

async function load(){
  if(!sb){
    throw Error("No se encontró la configuración de Supabase.");
  }

  const results=await Promise.all(
    tables.map(async table=>{
      const {data:rows,error}=await sb
        .from(table)
        .select("*");

      if(error){
        console.warn(table+": "+error.message);
        return [table, []];
      }

      return [table,rows||[]];
    })
  );

  data=Object.fromEntries(results);

  schools=(data.schools||[]).sort((a,b)=>
    String(a.code||"").localeCompare(
      String(b.code||""),
      "es",
      {numeric:true}
    )
  );

  $("#schoolFilter").innerHTML=`
    <option value="all">Todas las escuelas</option>
    ${schools.map(s=>`
      <option value="${s.id}">
        ${esc(s.code)} · ${esc(s.name)}
      </option>
    `).join("")}
  `;

  if(filter!=="all"&&!schools.some(s=>s.id===filter)){
    filter="all";
  }

  $("#schoolFilter").value=filter;

  render();
}

function navigation(){
  const items=[
    ["dashboard","Panel general"],
    ["schoolManagement","Gestión de escuelas de mi área"],
    ["schools","Carpetas por escuela"],
    ["reports","Informes de supervisión"],
    ["improvements","Áreas de mejora"],
    ...Object.entries(labels)
  ];

  $("#nav").innerHTML=items.map(([key,label])=>`
    <button
      data-page="${key}"
      class="${page===key?"active":""}">
      ${esc(label)}
    </button>
  `).join("");

  $("#nav").querySelectorAll("[data-page]")
    .forEach(button=>{
      button.onclick=()=>{
        page=button.dataset.page;
        selectedSchool=null;
        render();
      };
    });
}

function render(){
  navigation();

  const titles={
    dashboard:"Panel supervisivo",
    schoolManagement:"Gestión de escuelas de mi área",
    schools:"Carpetas institucionales",
    reports:"Informes de supervisión",
    improvements:"Áreas de mejora",
    ...labels
  };

  $("#pageTitle").textContent=titles[page]||"SISE";

  if(page==="dashboard")return dashboard();
  if(page==="schoolManagement")return schoolManagement();
  if(page==="schools")return schoolFolders();
  if(page==="reports")return reportsPage();
  if(page==="improvements")return improvements();
  if(labels[page])return recordsPage(page);
}

function dashboard(){
  const ids=filter==="all"
    ?schools.map(s=>s.id)
    :[filter];

  const reports=rowsFor("supervision_reports");
  const agreements=rowsFor("agreements");
  const incidents=rowsFor("incidents");

  const validated=ids.flatMap(id=>findingsFor(id));

  const latest=ids.map(id=>
    rowsFor("metrics",id)
      .sort((a,b)=>
        String(b.period||"").localeCompare(
          String(a.period||"")
        )
      )[0]
  ).filter(Boolean);

  const attendance=latest.filter(
    metric=>metric.attendance_pct!=null
  );

  const average=attendance.length
    ?(
      attendance.reduce(
        (sum,metric)=>sum+Number(metric.attendance_pct),
        0
      )/attendance.length
    ).toFixed(1)+"%"
    :"Sin datos";

  $("#content").innerHTML=`
    <div class="cards">
      <div class="card">
        Escuelas
        <strong>${ids.length}</strong>
      </div>

      <div class="card">
        Informes
        <strong>${reports.length}</strong>
      </div>

      <div class="card">
        Áreas validadas
        <strong>${validated.length}</strong>
      </div>

      <div class="card">
        Acuerdos pendientes
        <strong>${
          agreements.filter(a=>a.status!=="cumplido").length
        }</strong>
      </div>
    </div>

    <div class="panel">
      <h2>Seguimiento institucional</h2>

      <p>
        Asistencia promedio del último registro:
        <b>${average}</b>
      </p>

      <p class="muted small">
        Promedio simple de escuelas con datos.
        No está ponderado por matrícula.
      </p>

      <p>
        Situaciones de convivencia abiertas:
        <b>${
          incidents.filter(i=>i.status!=="cerrado").length
        }</b>
      </p>
    </div>

    <div class="panel">
      <h2>Áreas de mejora identificadas</h2>

      ${validated.length
        ?validated.slice(0,20).map(f=>`
          <p>
            <span class="pill">
              ${esc(schoolName(f.report.school_id))}
            </span>
            <b>${esc(f.dimension)}</b>:
            ${esc(f.summary)}
          </p>
        `).join("")
        :'<p class="muted">Todavía no hay áreas validadas.</p>'
      }
    </div>

    <div class="panel">
      <h2>Acceso a legajos</h2>
      <button id="goSchools">
        Abrir carpetas institucionales
      </button>
    </div>
  `;

  $("#goSchools").onclick=()=>{
    page="schools";
    render();
  };
}

/* ==========================================
   GESTIÓN DE ESCUELAS
========================================== */

function schoolManagement(){
  $("#content").innerHTML=`
    <div class="panel">
      <h2>Gestión de escuelas de mi área</h2>

      <p class="muted">
        Incorporá y actualizá las instituciones
        bajo supervisión. Cada escuela contará
        con un legajo digital propio.
      </p>

      ${canManageSchools()
        ?`<button id="addSchool">+ Agregar escuela</button>`
        :`<p class="muted">
          La modificación de escuelas requiere
          permisos de administración o supervisión.
        </p>`
      }
    </div>

    <div class="panel">
      <h2>Escuelas registradas (${schools.length})</h2>

      ${schools.map(s=>`
        <div class="row">
          <div>
            <strong>
              ${esc(s.code)} · ${esc(s.name)}
            </strong>

            <div class="muted small">
              ${esc(s.locality||"Sin localidad")}
              · Dirección/Directivo:
              ${esc(s.director||"Sin registrar")}
            </div>
          </div>

          <div class="actions">
            <button class="secondary"
              data-open-school="${s.id}">
              Abrir carpeta
            </button>

            ${canManageSchools()
              ?`<button data-edit-school="${s.id}">
                  Editar
                </button>
                <button class="danger" data-delete-school="${s.id}">
                  Eliminar
                </button>`
              :""
            }
          </div>
        </div>
      `).join("")||`
        <p class="muted">
          Todavía no hay escuelas registradas.
        </p>
      `}
    </div>
  `;

  $("#addSchool")?.addEventListener("click", ()=>schoolForm());

  $("#content").querySelectorAll("[data-edit-school]").forEach(button=>{
    button.onclick=()=>schoolForm(schools.find(s=>s.id===button.dataset.editSchool));
  });

  $("#content").querySelectorAll("[data-delete-school]").forEach(button=>{
    button.onclick=()=>deleteSchool(button.dataset.deleteSchool);
  });

  $("#content").querySelectorAll("[data-open-school]").forEach(button=>{
    button.onclick=()=>{
      filter=button.dataset.openSchool;
      selectedSchool=filter;
      $("#schoolFilter").value=filter;
      page="schools";
      render();
    };
  });
}

function schoolForm(record=null){
  if(!canManageSchools())return;

  modalAction={
    type:"school",
    record
  };

  $("#modalTitle").textContent=record
    ?"Editar escuela"
    :"Agregar escuela de mi área";

  const fields=[
    ["code","Número / Código de escuela (Ej.: EP N° 7)",true],
    ["name","Nombre de la institución",true],
    ["locality","Localidad / Distrito",false],
    ["address","Domicilio",false],
    ["shifts","Turnos",false],
    ["director","Director/a o Equipo Directivo",false],
    ["sections","Cantidad de secciones",false],
    ["notes","Observaciones institucionales",false]
  ];

  $("#modalBody").innerHTML=`
    <div class="formgrid">
      ${fields.map(([key,label,required])=>`
        <div class="${key==="notes"?"wide":""}">
          <label>${esc(label)}</label>

          ${key==="notes"
            ?`<textarea name="${key}">${esc(record?.[key]||"")}</textarea>`
            :`<input
                name="${key}"
                type="${key==="sections"?"number":"text"}"
                ${key==="sections"?'min="0" step="1"':""}
                value="${esc(record?.[key]??"")}"
                ${required?"required":""}
              >`
          }
        </div>
      `).join("")}
    </div>
  `;

  $("#modal").showModal();
}

async function saveSchool(){
  if(!canManageSchools()){
    throw Error("No tenés permisos para gestionar escuelas.");
  }

  const values=Object.fromEntries(
    new FormData($("#modalForm")).entries()
  );

  values.code=values.code.trim();
  values.name=values.name.trim();

  if(!values.code||!values.name){
    throw Error("Completá el número/código y el nombre.");
  }

  values.sections=values.sections===""?null:Number(values.sections);

  for(const key of ["locality","address","shifts","director","notes"]){
    values[key]=values[key]?.trim()||null;
  }

  const record=modalAction.record;

  const query=record
    ?sb.from("schools").update(values).eq("id",record.id)
    :sb.from("schools").insert(values);

  const {error}=await query;
  if(error)throw error;
}

async function deleteSchool(id){
  const school = schools.find(s=>s.id===id);
  if(!school) return;

  if(confirm(`¿Estás seguro de que querés eliminar la escuela "${school.code} - ${school.name}"? Se perderá la vinculación de sus legajos.`)){
    const {error} = await sb.from("schools").delete().eq("id", id);
    if(error){
      notify("Error al eliminar: " + error.message);
    } else {
      notify("Escuela eliminada con éxito.");
      await load();
    }
  }
}

/* ==========================================
   CARPETAS INDIVIDUALES POR ESCUELA
========================================== */

function schoolFolders(){
  const list=filter==="all"
    ?schools
    :schools.filter(s=>s.id===filter);

  $("#content").innerHTML=`
    <div class="notice">
      Cada institución dispone de su propio
      legajo digital de supervisión.
    </div>

    <div class="schoolgrid">
      ${list.map(s=>`
        <button class="schoolcard" data-school="${s.id}">
          <span style="font-size:30px">📁</span>
          <strong>${esc(s.code)}</strong>
          <span>${esc(s.name)}</span>
          <p class="muted small">
            ${reportsFor(s.id).length} informes de supervisión
          </p>
          <p class="muted small">
            ${findingsFor(s.id).length} áreas de mejora validadas
          </p>
        </button>
      `).join("")}
    </div>

    <div id="schoolDetail"></div>
  `;

  $("#content").querySelectorAll("[data-school]").forEach(button=>{
    button.onclick=()=>schoolDetail(button.dataset.school);
  });

  if(selectedSchool && list.some(s=>s.id===selectedSchool)){
    schoolDetail(selectedSchool);
  }else if(filter!=="all"){
    schoolDetail(filter);
  }
}

function schoolDetail(id){
  const school=schools.find(s=>s.id===id);
  if(!school)return;

  selectedSchool=id;

  const reports=reportsFor(id);
  const findings=findingsFor(id);
  const agreements=rowsFor("agreements",id);
  const visits=rowsFor("visits",id);
  const incidents=rowsFor("incidents",id);
  const strikes=rowsFor("strikes",id);

  const metrics=rowsFor("metrics",id)
    .sort((a,b)=>
      String(b.period||"").localeCompare(
        String(a.period||"")
      )
    );

  $("#schoolDetail").innerHTML=`

/* ==========================================
   DETECCIÓN AUTOMÁTICA Y ANÁLISIS DE INFORMES
========================================== */

const patterns = {
  "Enseñanza": {
    keywords: ["enseñanza", "intervenciones docentes", "diversificación", "secuencia didáctica", "planificación", "propuesta pedagógica", "prácticas de enseñanza", "clase"],
    orientationPrefix: "Orientación pedagógica en enseñanza: Se requiere fortalecer las intervenciones docentes y la planificación didáctica enfocada en "
  },
  "Alfabetización": {
    keywords: ["alfabetización", "lectura", "escritura", "situaciones de lectura", "producciones escritas", "comprensión lectora", "fonética", "textos"],
    orientationPrefix: "Orientación en alfabetización: Es necesario intensificar las situaciones habituales de lectura y escritura para afianzar "
  },
  "Matemática": {
    keywords: ["matemática", "resolución de problemas", "cálculo", "numeración", "operaciones", "geometría", "problemas matemáticos"],
    orientationPrefix: "Orientación en matemática: Se sugiere propiciar espacios sistemáticos de resolución de problemas y revisión de "
  },
  "Trayectorias educativas": {
    keywords: ["trayectoria", "inasistencias", "revinculación", "continuidad pedagógica", "intensificación", "ausentismo", "abandono", "promoción"],
    orientationPrefix: "Orientación sobre trayectorias: Se debe dar seguimiento riguroso a la asistencia y planear estrategias de acompañamiento para "
  },
  "Convivencia": {
    keywords: ["convivencia", "conflicto", "acuerdos de convivencia", "intervención institucional", "normas", "vínculos", "clima escolar", "violencia"],
    orientationPrefix: "Orientación institucional en convivencia: Se aconseja activar mesas de trabajo y revisar los acuerdos institucionales sobre "
  },
  "Gestión institucional": {
    keywords: ["equipo directivo", "seguimiento", "mesa de trabajo", "acuerdos institucionales", "registro institucional", "liderazgo", "organización"],
    orientationPrefix: "Orientación directiva: El equipo de conducción debe optimizar el monitoreo y los registros institucionales vinculados a "
  },
  "Inclusión educativa": {
    keywords: ["inclusión", "ppi", "configuraciones de apoyo", "propuesta pedagógica de inclusión", "integración", "discapacidad", "adecuaciones"],
    orientationPrefix: "Orientación en inclusión: Se requiere garantizar las configuraciones de apoyo necesarias y el seguimiento del PPI en relación con "
  }
};

function normalizeText(text){
  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase();
}

function extractSignals(text){
  const paragraphs = text.split(/\n+/)
    .map(p => p.trim())
    .filter(p => p.length > 20);

  const findings = [];

  for(const [dimension, data] of Object.entries(patterns)){
    const matchedParagraphs = paragraphs.filter(paragraph =>
      data.keywords.some(word =>
        normalizeText(paragraph).includes(normalizeText(word))
      )
    );

    if(matchedParagraphs.length > 0){
      const evidenceSnippet = matchedParagraphs.slice(0, 3).map(p => p.slice(0, 350)).join(" […] ");
      const autoSummary = `${data.orientationPrefix}los aspectos detectados en el informe: "${matchedParagraphs[0].slice(0, 120)}..."`;

      findings.push({
        dimension,
        summary: autoSummary,
        evidence: evidenceSnippet,
        confirmed: true
      });
    }
  }

  if(findings.length === 0 && text.length > 50){
    findings.push({
      dimension: "Gestión institucional",
      summary: "Revisión general del informe incorporado para seguimiento de acuerdos institucionales y prácticas pedagógicas.",
      evidence: text.slice(0, 400) + "...",
      confirmed: true
    });
  }

  return findings;
}

/* ==========================================
   EXTRACCIÓN DE TEXTO DE ARCHIVOS
========================================== */

async function extractFile(file){
  if(file.size > 15 * 1024 * 1024){
    throw Error("El archivo supera el límite permitido de 15 MB.");
  }

  const extension=file.name.split(".").pop().toLowerCase();

  if(extension==="txt"){
    return await file.text();
  }

  if(extension==="docx" || extension==="doc"){
    try {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer });
      return result.value;
    } catch(e) {
      throw Error("Error al leer el archivo Word: " + e.message);
    }
  }

  if(extension==="pdf"){
    try {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
      const pages = [];

      for(let number=1; number<=pdf.numPages; number++){
        const page = await pdf.getPage(number);
        const content = await page.getTextContent();
        pages.push(content.items.map(item => item.str || "").join(" "));
      }

      return pages.join("\n\n");
    } catch(e) {
      throw Error("Error al leer el archivo PDF: " + e.message);
    }
  }

  throw Error("Formato de archivo no admitido.");
}

/* ==========================================
   GUARDADO DE INFORMES
========================================== */

async function saveReport(){
  const file=$("#repFile").files[0];
  let text=$("#repText").value.trim();

  if(file){
    const extracted=(await extractFile(file)).trim();
    if(extracted){
      text=[text,extracted].filter(Boolean).join("\n\n");
    }
  }

  if(text.length < 20){
    throw Error("El texto del informe es demasiado corto o no pudo extraerse del archivo.");
  }

  const payload={
    school_id:$("#repSchool").value,
    title:$("#repTitle").value.trim(),
    report_date:$("#repDate").value,
    report_text:text,
    source_filename:file?.name||null,
    findings:extractSignals(text)
  };

  if(!payload.title||!payload.report_date){
    throw Error("Completá el título y la fecha.");
  }

  const {error}=await sb.from("supervision_reports").insert(payload);

  if(error)throw error;
}

    `).join("")||`<p>No se identificaron coincidencias automáticas.</p>`}

}

async function saveReview(){
  const report=modalAction.record;

  const findings=(report.findings||[]).map((finding,index)=>({
    ...finding,
    confirmed:!!$(`[data-check="${index}"]`)?.checked,
    summary:$(`[data-summary="${index}"]`)?.value.trim()||finding.summary
  }));

  const {error}=await sb.from("supervision_reports").update({findings}).eq("id",report.id);

  if(error)throw error;
}

/* ==========================================
   AUTENTICACIÓN
========================================== */

$("#logout").onclick=async()=>{
  await sb.auth.signOut();
  location.reload();
};

$("#loginForm").onsubmit=async event=>{
  event.preventDefault();
  $("#loginError").textContent="";

  try{
    if(!sb){
      throw Error("No se encontró la configuración de Supabase.");
    }

    const {error}=await sb.auth.signInWithPassword({
      email:$("#email").value,
      password:$("#password").value
    });

    if(error)throw error;

    await start();

  }catch(error){
    $("#loginError").textContent=error.message;
  }
};

async function start(){
  if(!sb){
    throw Error("Falta la conexión con Supabase.");
  }

  const {data:auth,error:authError}=await sb.auth.getUser();

  if(authError||!auth.user)return;

  user=auth.user;

  const {data:profile,error}=await sb
    .from("profiles")
    .select("role,full_name")
    .eq("id",user.id)
    .single();

  if(error||!profile){
    throw Error("La cuenta no tiene un perfil autorizado.");
  }

  role=profile.role;

  $("#userInfo").textContent=(profile.full_name||user.email)+" · "+role;
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");

  await load();
}

if(sb){
  start().catch(error=>{
    notify(error.message);
    $("#login").classList.remove("hidden");
    $("#app").classList.add("hidden");
  });
}
